; The exports ci/android.sh makes. Options left out take Godot's defaults.
; Each preset packs data/, which the export script copies in beside the project (ShippedData unpacks it).

[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="data/*"
exclude_filter=""
export_path=""

[preset.0.options]

gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.markovcd.waitingsimulator"
package/name="Waiting Simulator"
screen/immersive_mode=true

[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/*"
exclude_filter=""
export_path=""

[preset.1.options]

binary_format/architecture="x86_64"
