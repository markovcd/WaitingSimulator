# Runs the gate (gate.sh, the command AGENTS.md names) on every push to main and every pull request.
# gate.sh builds the gate image (ci/gate.Dockerfile: the pinned .NET SDK and Godot) and runs every check in it,
# so CI runs exactly what a local gate run does. Restores inside are always locked to the committed lock files.
# Actions are pinned to commit SHAs and the image's base by digest; Dependabot (.github/dependabot.yml) proposes moving them.
name: Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # A run takes a few minutes, most of it pulling the SDK image and downloading Godot.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate
        run: ./gate.sh
